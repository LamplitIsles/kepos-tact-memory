[package]
name = "kepos-tact-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "Apache-2.0"
description = "Local SQLite Tact remote memory, published as a Kepos HTTP service with device-identity namespaces"

[dependencies]
tact-memory = { version = "0.6.6", default-features = false }
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5.3", features = ["limit"] }
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
